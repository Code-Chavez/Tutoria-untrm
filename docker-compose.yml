services:
  postgres:
    image: postgres:16-alpine
    container_name: sit-postgres
    environment:
      POSTGRES_DB: sit_db
      POSTGRES_USER: sit_user
      POSTGRES_PASSWORD: sit_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sit-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sit_user -d sit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sit-server
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://sit_user:sit_pass@postgres:5432/sit_db
      JWT_SECRET: dev-secret-change-in-production
      CORS_ORIGIN: http://localhost:5173
      # Correo de desarrollo: Mailpit recibe los mensajes (bandeja en http://localhost:8025).
      PUBLIC_APP_URL: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: SIT UNTRM <no-reply@untrm.edu.pe>
      # Sin sondeo, los cambios en el host no disparan recarga dentro del contenedor.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "3000:3000"
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - ./server/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sit-net

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: sit-mailpit
    ports:
      - "8025:8025"
    networks:
      - sit-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sit-client
    environment:
      VITE_PROXY_TARGET: http://server:3000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    depends_on:
      - server
    networks:
      - sit-net

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: sit-backup
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: sit_user
      PGPASSWORD: sit_pass
      PGDATABASE: sit_db
      # Respaldo diario a las 02:00 de la base y de los adjuntos; conservar los últimos 7.
      BACKUP_CRON: "0 2 * * *"
      BACKUP_KEEP: "7"
      BACKUP_STORAGE_DIR: /data/storage
      # Copia FUERA de este equipo (obligatoria en producción): una carpeta montada de otro disco o
      # servidor (BACKUP_OFFSITE_DIR) y/o un comando propio que recibe $BACKUP_FILE (BACKUP_UPLOAD_CMD,
      # p. ej. rclone copy "$BACKUP_FILE" remoto:sit). Sin ninguno, el respaldo avisa que es solo local.
      # BACKUP_OFFSITE_DIR: /offsite
    volumes:
      - backup_data:/backups
      - ./server/storage:/data/storage:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sit-net

volumes:
  pgdata:
  backup_data:

networks:
  sit-net:
    driver: bridge
