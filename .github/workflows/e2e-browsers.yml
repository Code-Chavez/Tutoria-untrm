name: E2E browsers (Firefox, WebKit)

# Segundo job de E2E del pipeline: el principal (ci.yml) usa Chrome; aquí corren Firefox y WebKit sobre Linux. Decisión del issue #231 (2026-11-07):
# - Chrome: toda PR (ci.yml, 13 suites). Edge es Chromium (mismo motor): se prueba a mano antes de cada release, no en el pipeline.
# - Firefox: toda PR que toque client, server, e2e o este archivo, con E2E-21, 22, 23, 26 y 27 (~4 min).
# - WebKit en Linux: solo E2E-27, porque se cae («Page crashed») al recargar en otros recorridos; a mano se le puede pasar otras suites.
# - Ambos corren además cada noche, para detectar una regresión de motor sin que ninguna PR la toque.
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - 'client/**'
      - 'server/**'
      - 'e2e/**'
      - '.github/workflows/e2e-browsers.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      specs:
        description: 'Suites a correr en cada navegador (p. ej. "e2e-21 e2e-22 e2e-23"); vacío = las de la matriz'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    name: E2E — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            specs: e2e-21 e2e-22 e2e-23 e2e-26 e2e-27
          # WebKit en Linux se cae («Page crashed») al recargar o navegar en distintos casos de E2E-26 (cambia de caso entre ejecuciones; en Windows pasa 20/20). Aquí solo se corre E2E-27 (accesibilidad, teclado, móvil), que pasa 10/10.
          - browser: webkit
            specs: e2e-27

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sit_user
          POSTGRES_PASSWORD: sit_pass
          POSTGRES_DB: sit_db_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sit_user -d sit_db_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Bandeja de correo de pruebas: el enlace de aceptación del docente solo llega por correo.
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://sit_user:sit_pass@localhost:5432/sit_db_e2e
      JWT_SECRET: ci-e2e-secret
      E2E_BASE_URL: http://localhost:5174
      E2E_API_URL: http://localhost:3100/api
      E2E_MAILPIT_URL: http://localhost:8025
      E2E_BROWSER: ${{ matrix.browser }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }} in the disposable runner
        working-directory: e2e
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Prepare the database (client, migrations, seed)
        working-directory: server
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
          pnpm run seed

      - name: Start the server and the client
        run: |
          (cd server && PORT=3100 CORS_ORIGIN=http://localhost:5174 PUBLIC_APP_URL=http://localhost:5174 SMTP_HOST=localhost SMTP_PORT=1025 MAIL_FROM="SIT UNTRM <no-reply@untrm.edu.pe>" nohup pnpm exec ts-node -r tsconfig-paths/register --transpile-only src/index.ts > "$RUNNER_TEMP/server.log" 2>&1 &)
          (cd client && VITE_PROXY_TARGET=http://localhost:3100 nohup pnpm exec vite --port 5174 --strictPort > "$RUNNER_TEMP/client.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3100/api/health > /dev/null 2>&1 && curl -fsS http://localhost:5174 > /dev/null 2>&1; then echo "stack ready"; exit 0; fi
            sleep 3
          done
          echo "The stack did not start"; tail -n 40 "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/client.log"; exit 1

      - name: Run the journeys on ${{ matrix.browser }}
        working-directory: e2e
        env:
          INPUT_SPECS: ${{ inputs.specs }}
        run: pnpm exec playwright test ${INPUT_SPECS:-${{ matrix.specs }}}

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.browser }}-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Show server log on failure
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/server.log" || true
