name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend-lint-build-test:
    name: Backend — Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sit_db_test
          POSTGRES_USER: sit_user
          POSTGRES_PASSWORD: sit_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sit_user -d sit_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sit_user:sit_pass@localhost:5432/sit_db_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm prisma generate

      - name: Push schema to database
        working-directory: backend
        run: pnpm prisma db push

      - name: Build
        working-directory: backend
        run: pnpm run build

      - name: Run tests
        working-directory: backend
        run: pnpm test

      - name: Audit dependencies
        working-directory: backend
        run: pnpm audit --prod || true

  frontend-lint-build:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm tsc --noEmit

      - name: Build
        working-directory: frontend
        run: pnpm run build

  docker-build:
    name: Docker — Build images
    runs-on: ubuntu-latest
    needs: [backend-lint-build-test, frontend-lint-build]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t sit-backend ./backend

      - name: Build frontend image
        run: docker build -t sit-frontend ./frontend
