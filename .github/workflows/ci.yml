name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Server ───────────────────────────────────────────────
  server-lint:
    name: Server — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: server
        run: pnpm run lint

  server-build:
    name: Server — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: server
        run: pnpm prisma generate

      - name: Build
        working-directory: server
        run: pnpm run build

  server-test:
    name: Server — Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sit_db_test
          POSTGRES_USER: sit_user
          POSTGRES_PASSWORD: sit_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sit_user -d sit_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sit_user:sit_pass@localhost:5432/sit_db_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      # Las pruebas de acceso por HTTP necesitan la base real: sin ella la suite falla en vez de omitirlas (A18).
      REQUIRE_DB_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: server
        run: pnpm prisma generate

      - name: Apply database migrations
        working-directory: server
        run: pnpm prisma migrate deploy

      - name: Seed database (accounts used by the access-control tests)
        working-directory: server
        run: pnpm run seed

      - name: Run tests with coverage
        working-directory: server
        run: pnpm test -- --ci --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/lcov.info
          retention-days: 30

  server-audit:
    name: Server — Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: server
        run: pnpm audit --prod

  # ── Client ───────────────────────────────────────────────
  client-lint:
    name: Client — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: client
        run: pnpm run lint

  client-audit:
    name: Client — Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: client
        run: pnpm audit --prod

  client-test:
    name: Client — Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: client
        run: pnpm test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/lcov.info
          retention-days: 30

  client-build:
    name: Client — Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: client
        run: pnpm tsc --noEmit

      - name: Build
        working-directory: client
        run: pnpm run build

  # ── Respaldo ─────────────────────────────────────────────
  backup-drill:
    name: Backup — Restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: sit_user
          POSTGRES_PASSWORD: sit_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sit_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build backup image
        run: docker build -t sit-backup ./backup

      # Ensayo aislado (A10): respaldo normal, fallo de conexión, restauración con adjuntos y rechazo de
      # respaldos alterados. Si el respaldo aparentara éxito donde falló, este job falla.
      - name: Backup and restore drill
        run: >-
          docker run --rm --network host
          -e PGHOST=127.0.0.1 -e PGUSER=sit_user -e PGPASSWORD=sit_pass -e PGDATABASE=postgres
          --entrypoint /usr/local/bin/test-backup.sh sit-backup

  # ── Docker ───────────────────────────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs:
      - server-lint
      - server-build
      - server-test
      - server-audit
      - client-audit
      - client-lint
      - client-test
      - client-build
      - backup-drill
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -t sit-server ./server

      - name: Build client image
        run: docker build -t sit-client ./client
